<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Option 3 -- Single Phone with 3D Tilt</title>
    <link rel="stylesheet" href="styles.css?v=11">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .hero-tilt {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            padding: 0 3rem;
        }

        .hero-tilt-text {
            position: relative;
            z-index: 10;
            max-width: 620px;
            padding-left: 2rem;
            flex-shrink: 0;
        }

        .hero-tilt-text .hero-label {
            font-size: 1.125rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-navy);
            margin-bottom: 1.5rem;
            display: block;
        }

        .hero-tilt-text .hero-title {
            font-size: clamp(2rem, 4vw, 4.5rem);
            font-weight: 300;
            line-height: 1.1;
            color: var(--color-navy);
        }

        /* Single 3D Phone */
        .phone-tilt-wrapper {
            flex-shrink: 0;
            perspective: 1000px;
            padding-right: 8%;
        }

        .phone-tilt {
            position: relative;
            width: 300px;
            height: 650px;
            transform-style: preserve-3d;
            animation: gentleTilt 8s ease-in-out infinite;
        }

        @keyframes gentleTilt {
            0%, 100% {
                transform: rotateY(-15deg) rotateX(3deg);
            }
            25% {
                transform: rotateY(-8deg) rotateX(-2deg);
            }
            50% {
                transform: rotateY(10deg) rotateX(2deg);
            }
            75% {
                transform: rotateY(5deg) rotateX(-3deg);
            }
        }

        .phone-tilt-frame {
            position: relative;
            width: 100%;
            height: 100%;
            background: #1e1e20;
            border-radius: 44px;
            padding: 10px;
            box-shadow:
                0 40px 80px rgba(0,0,0,0.12),
                0 15px 30px rgba(0,0,0,0.08),
                inset 0 1px 0 rgba(255,255,255,0.1),
                -8px 0 30px rgba(0,0,0,0.06);
            transform-style: preserve-3d;
        }

        /* Glass reflection overlay */
        .phone-tilt-frame::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border-radius: 34px;
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.12) 0%,
                rgba(255,255,255,0) 40%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.05) 100%
            );
            pointer-events: none;
            z-index: 3;
        }

        .phone-tilt-screen {
            width: 100%;
            height: 100%;
            border-radius: 34px;
            overflow: hidden;
            background: #f5f5f5;
            position: relative;
        }

        .phone-tilt-screen video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .phone-tilt-screen video.active {
            opacity: 1;
        }

        .phone-tilt-notch {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 86px;
            height: 26px;
            background: #0f0f0f;
            border-radius: 13px;
            z-index: 4;
        }

        /* Subtle shadow underneath */
        .phone-shadow {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 30px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.12) 0%, transparent 70%);
            filter: blur(8px);
        }

        /* Project label that fades with the video */
        .phone-project-label {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-text-muted, #888);
            opacity: 0;
            transition: opacity 0.6s ease;
            white-space: nowrap;
        }

        .phone-project-label.active {
            opacity: 0.5;
        }

        @media (min-width: 1600px) {
            .hero-tilt {
                padding: 0 4rem;
            }
            .hero-tilt-text {
                padding-left: 6rem;
            }
            .phone-tilt {
                width: 360px;
                height: 780px;
            }
            .phone-tilt-frame {
                border-radius: 52px;
                padding: 12px;
            }
            .phone-tilt-screen {
                border-radius: 40px;
            }
            .phone-tilt-frame::after {
                border-radius: 40px;
                top: 12px;
                left: 12px;
                right: 12px;
                bottom: 12px;
            }
            .phone-tilt-notch {
                width: 100px;
                height: 30px;
                border-radius: 15px;
                top: 22px;
            }
        }

        @media (max-width: 900px) {
            .hero-tilt {
                flex-direction: column;
                padding: 6rem 2rem 4rem;
                min-height: auto;
                gap: 3rem;
            }
            .hero-tilt-text {
                padding-left: 0;
                max-width: none;
            }
            .phone-tilt-wrapper {
                padding-right: 0;
            }
            .phone-tilt {
                width: 240px;
                height: 520px;
                animation-name: gentleTiltMobile;
            }
            @keyframes gentleTiltMobile {
                0%, 100% { transform: rotateY(-8deg) rotateX(2deg); }
                50% { transform: rotateY(8deg) rotateX(-2deg); }
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-logo active">Jonathan Bowden</a>
        <div class="nav-links">
            <a href="play.html" class="nav-link">PLAY</a>
            <a href="diff.html" class="nav-link">DIFF</a>
            <a href="#contact" class="nav-link">BUILD</a>
        </div>
    </nav>

    <section class="hero-tilt">
        <div class="hero-tilt-text">
            <span class="hero-label">PRINCIPAL DESIGN DIRECTOR</span>
            <h1 class="hero-title">Building 0&rarr;1 experiences @ Expedia via OpenAI, Cond&eacute; Nast, Alexa+ &amp; more</h1>
        </div>

        <div class="phone-tilt-wrapper">
            <div class="phone-tilt">
                <div class="phone-tilt-frame">
                    <div class="phone-tilt-notch"></div>
                    <div class="phone-tilt-screen" id="tiltScreen">
                        <!-- Videos injected by JS -->
                    </div>
                </div>
                <div class="phone-shadow"></div>
                <div class="phone-project-label" id="projectLabel"></div>
            </div>
        </div>
    </section>

    <script>
    (function() {
        var projects = [
            { src: 'images/creators_video_1@1x.mp4', label: 'Creators' },
            { src: 'images/partners_video_1@1x.mp4', label: 'Partnerships' },
            { src: 'images/intel_video_1@1x.mp4', label: 'Intelligence' },
            { src: 'images/flo_video_1@1x.mp4', label: 'DailyFLO' },
            { src: 'images/partners_video_3@1x.mp4', label: 'Partnerships' },
            { src: 'images/creators_video_2@1x.mp4', label: 'Creators' }
        ];

        var screen = document.getElementById('tiltScreen');
        var label = document.getElementById('projectLabel');
        var current = 0;
        var videoEls = [];

        // Create all video elements
        projects.forEach(function(p, i) {
            var v = document.createElement('video');
            v.muted = true;
            v.playsInline = true;
            v.preload = 'auto';
            v.src = p.src;
            if (i === 0) v.classList.add('active');
            screen.appendChild(v);
            videoEls.push(v);
        });

        // Start first video
        label.textContent = projects[0].label;
        label.classList.add('active');
        videoEls[0].play().catch(function(){});

        // Cycle through on video end
        function advance() {
            var prev = current;
            current = (current + 1) % projects.length;

            // Fade label
            label.classList.remove('active');
            setTimeout(function() {
                label.textContent = projects[current].label;
                label.classList.add('active');
            }, 400);

            // Crossfade videos
            videoEls[prev].classList.remove('active');
            videoEls[current].classList.add('active');
            videoEls[current].currentTime = 0;
            videoEls[current].play().catch(function(){});
        }

        videoEls.forEach(function(v) {
            v.addEventListener('ended', advance);
        });

        // Fallback timer in case video doesn't fire ended
        setInterval(function() {
            var v = videoEls[current];
            if (v.paused && v.readyState >= 2) {
                v.play().catch(function(){});
            }
        }, 2000);
    })();
    </script>
</body>
</html>
